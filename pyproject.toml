[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coo-real-estate-lab"
version = "0.3.0"
description = "Week 3: Controlled engineering demonstration of a real-estate operations assistant workflow with local mock tools and a deterministic, tenant-scoped RAG evaluation lab."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Portfolio Demo"}]
dependencies = [
    "email-validator>=2.1,<3",
    "fastapi>=0.110,<0.116",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "uvicorn[standard]>=0.27,<0.31",
    "httpx>=0.27,<0.28",
    # Official MCP Python SDK for the local stdio server. 1.12.x is the newest line
    # compatible with the pinned uvicorn<0.31 and FastAPI<0.116 (Starlette<0.47).
    "mcp>=1.12,<1.13",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.3,<0.7",
]

[project.scripts]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
